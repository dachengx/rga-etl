<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PID Live Display</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #20242a;
        font-family: Arial, sans-serif;
      }

      #toolbar {
        height: 46px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        color: white;
        background: #30363d;
      }

      button {
        padding: 6px 12px;
        cursor: pointer;
      }

      #statusText {
        margin-left: auto;
        font-size: 14px;
        color: #c8d1da;
      }

      #viewport {
        width: 100%;
        height: calc(100% - 46px);
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /*
       The overlay coordinate system is the reference size set in
       the script (referenceSize), not the pixel size of pid.png.
    */
      #pidContainer {
        position: relative;
        display: inline-block;
        max-width: 100%;
        user-select: none;
      }

      #pidImage {
        display: block;
        width: 100%;
        height: auto;
      }

      #overlayCanvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <div id="toolbar">
      <button id="fitButton">Fit to screen</button>
      <button id="actualSizeButton">Actual size</button>
      <button id="editButton">Edit positions: OFF</button>
      <button id="copyButton">Copy positions</button>

      <span id="statusText">Waiting for data...</span>
    </div>

    <div id="viewport">
      <div id="pidContainer">
        <img id="pidImage" alt="PID diagram" />
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>

    <script>
      // ============================================================
      // POSITION CONFIGURATION
      //
      // x and y are coordinates in the reference size below. They do
      // not depend on the monitor resolution or on the pixel size of
      // pid.png, so pid.png can be re-exported at any resolution.
      //
      // Positions only need updating if the drawing itself changes
      // (symbols moved, or a different crop/margin).
      //
      // A sensor box is centered on x and starts at y. With
      // align: "left", x is the left edge of the box instead.
      //
      // Change x and y here, or turn on "Edit positions" and drag
      // the indicators with the mouse.
      // ============================================================

      const referenceSize = { width: 1492, height: 581 };

      const valveDefinitions = [
        { id: "PV2001", label: "PV2001", x: 120.25, y: 270.25 },
        { id: "PV2002", label: "PV2002", x: 190.25, y: 340.25 },
        { id: "PV2003", label: "PV2003", x: 300.25, y: 270.25 },
        { id: "PV2004", label: "PV2004", x: 300.25, y: 210.25 },
        { id: "PV2005", label: "PV2005", x: 540.25, y: 270.25 },
        { id: "PV2006", label: "PV2006", x: 1160.25, y: 270.25 },
        { id: "PV2009", label: "PV2009", x: 730.25, y: 150.25 },
        { id: "PV2010", label: "PV2010", x: 120.25, y: 210.25 },
        { id: "PV2011", label: "PV2011", x: 670.25, y: 150.25 },
        { id: "PV2112", label: "PV2112", x: 1070.25, y: 370.25 },
        { id: "PV2113", label: "PV2113", x: 790.25, y: 370.25 },
        { id: "PV2114", label: "PV2114", x: 1000.25, y: 420.25 },
        { id: "PV2115", label: "PV2115", x: 1070.25, y: 470.25 },
        { id: "PV2116", label: "PV2116", x: 790.25, y: 470.25 },
      ];

      const pumpDefinitions = [
        { id: "TP2001", label: "TP2001", x: 1410.5, y: 270.5 },
        { id: "BP2001", label: "BP2001", x: 1470.5, y: 270.5 },
        { id: "TP2102", label: "TP2102", x: 930.5, y: 420.5 },
        { id: "BP2102", label: "BP2102", x: 1150.5, y: 420.5 },
      ];

      const sensorDefinitions = [
        {
          id: "PT2001Tor",
          // label: "PT2001",
          unit: "Tor",
          decimals: 0,
          x: 190.25,
          y: 108,
        },
        {
          id: "PT2002Bar",
          // label: "PT2002",
          unit: "mBar",
          scale: 1000,
          decimals: 0,
          x: 780.25,
          y: 241,
        },
        {
          id: "PT2003Tor",
          // label: "PT2003",
          unit: "Tor",
          decimals: 2,
          x: 1290.25,
          y: 148,
        },
        {
          id: "PT2104Tor",
          // label: "PT2104",
          unit: "Tor",
          decimals: 2,
          x: 844,
          y: 501,
        },
        {
          id: "MFCFSetSLPM",
          label: "Set",
          unit: "slpm",
          decimals: 2,
          align: "left",
          x: 350,
          y: 291,
        },
        {
          id: "MFCFMsrSLPM",
          label: "Msr",
          unit: "slpm",
          decimals: 2,
          align: "left",
          x: 350,
          y: 313,
        },
        {
          id: "TP2001ActSpd",
          // label: "Spd",
          unit: "rpm",
          decimals: 0,
          x: 1410.5,
          y: 311,
        },
        {
          id: "TP2001DrvCrt",
          // label: "Crt",
          unit: "A",
          decimals: 2,
          x: 1410.5,
          y: 333,
        },
        {
          id: "TP2001TmpMtr",
          // label: "Tmp",
          unit: "°C",
          decimals: 0,
          x: 1410.5,
          y: 355,
        },
        {
          id: "TP2102ActSpd",
          // label: "Spd",
          unit: "rpm",
          decimals: 0,
          x: 930.5,
          y: 461,
        },
        {
          id: "TP2102DrvCrt",
          // label: "Crt",
          unit: "A",
          decimals: 2,
          x: 930.5,
          y: 483,
        },
        {
          id: "TP2102TmpMtr",
          // label: "Tmp",
          unit: "°C",
          decimals: 0,
          x: 930.5,
          y: 505,
        },
      ];

      // ============================================================
      // APPEARANCE
      // Sizes are in reference-size units, so they scale with pid.png.
      // ============================================================

      const displayStyle = {
        valveRadius: 22,

        valveOnColor: "rgba(0, 220, 80, 0.75)",
        valveOffColor: "rgba(255, 40, 40, 0.75)",
        valveUnknownColor: "rgba(150, 150, 150, 0.75)",

        valveBorderColor: "rgba(0, 0, 0, 0.9)",
        valveBorderWidth: 2,

        valveLabelColor: "black",
        valveLabelBackground: "rgba(255, 255, 255, 0.5)",
        valveLabelFont: "bold 10px Arial",

        pumpRadius: 22,

        pumpOnColor: "rgba(0, 220, 80, 0.75)",
        pumpOffColor: "rgba(255, 40, 40, 0.75)",
        pumpUnknownColor: "rgba(150, 150, 150, 0.75)",

        pumpBorderColor: "rgba(0, 0, 0, 0.9)",
        pumpBorderWidth: 2,

        pumpLabelColor: "black",
        pumpLabelBackground: "rgba(255, 255, 255, 0.5)",
        pumpLabelFont: "bold 10px Arial",

        sensorValueColor: "black",
        sensorBackground: "rgba(255, 255, 255, 0.5)",
        sensorBorderColor: "rgba(0, 0, 0, 0.8)",
        sensorFont: "bold 16px Arial",

        selectedColor: "#00aaff",
      };

      // ============================================================
      // EXAMPLE LIVE DATA
      //
      // Replace this dictionary with the JSON dictionary received
      // from Python later.
      // ============================================================

      let liveData = {
        PV2001: false,
        PV2002: false,
        PV2003: false,
        PV2004: false,
        PV2005: false,
        PV2006: false,
        PV2009: false,
        PV2010: false,
        PV2011: false,
        PV2112: false,
        PV2113: false,
        PV2114: false,
        PV2115: false,
        PV2116: false,
        BP2001: false,
        TP2001: false,
        BP2102: false,
        TP2102: false,

        PT2001Tor: 0.0,
        PT2002Bar: 0.0,
        PT2003Tor: 0.0,
        PT2104Tor: 0.0,
        MFCFSetSLPM: 0.0,
        MFCFMsrSLPM: 0.0,
        TP2001ActSpd: 0.0,
        TP2001DrvCrt: 0.0,
        TP2001TmpMtr: 0.0,
        TP2102ActSpd: 0.0,
        TP2102DrvCrt: 0.0,
        TP2102TmpMtr: 0.0,
      };

      const image = document.getElementById("pidImage");
      const canvas = document.getElementById("overlayCanvas");
      const context = canvas.getContext("2d");
      const container = document.getElementById("pidContainer");
      const viewport = document.getElementById("viewport");
      const statusText = document.getElementById("statusText");

      let editMode = false;
      let selectedItem = null;
      let draggingItem = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      // true: refit when the window is resized. false after "Actual size".
      let autoFit = true;

      // ============================================================
      // INITIALIZATION
      // ============================================================

      image.addEventListener("load", () => {
        fitToScreen();
        resizeCanvas();

        const imageRatio = image.naturalWidth / image.naturalHeight;
        const referenceRatio = referenceSize.width / referenceSize.height;

        statusText.textContent =
          Math.abs(imageRatio / referenceRatio - 1) > 0.01
            ? `pid.png aspect ratio changed (${image.naturalWidth} × ${image.naturalHeight}); positions may be off`
            : `Image: ${image.naturalWidth} × ${image.naturalHeight}`;
      });

      // Match the canvas resolution to its on-screen size and map the
      // reference coordinates onto it, so the overlay stays sharp and
      // aligned at any image resolution or zoom.
      function resizeCanvas() {
        const rectangle = canvas.getBoundingClientRect();

        if (!rectangle.width || !rectangle.height) {
          return;
        }

        const pixelRatio = window.devicePixelRatio || 1;

        canvas.width = Math.round(rectangle.width * pixelRatio);
        canvas.height = Math.round(rectangle.height * pixelRatio);

        context.setTransform(
          canvas.width / referenceSize.width,
          0,
          0,
          canvas.height / referenceSize.height,
          0,
          0,
        );

        drawDisplay();
      }

      new ResizeObserver(resizeCanvas).observe(container);

      // Cache-busting query so an updated pid.png is always picked up.
      image.src = `pid.png?v=${Date.now()}`;

      // ============================================================
      // DRAWING
      // ============================================================

      function drawDisplay() {
        context.clearRect(0, 0, referenceSize.width, referenceSize.height);

        for (const valve of valveDefinitions) {
          drawValve(valve, liveData[valve.id]);
        }

        for (const pump of pumpDefinitions) {
          drawPump(pump, liveData[pump.id]);
        }

        for (const sensor of sensorDefinitions) {
          drawSensor(sensor, liveData[sensor.id]);
        }
      }

      function drawValve(valve, value) {
        let color = displayStyle.valveUnknownColor;

        if (value === true || value === 1) {
          color = displayStyle.valveOnColor;
        } else if (value === false || value === 0) {
          color = displayStyle.valveOffColor;
        }

        context.beginPath();
        context.arc(valve.x, valve.y, displayStyle.valveRadius, 0, Math.PI * 2);

        context.fillStyle = color;
        context.fill();

        context.lineWidth =
          selectedItem === valve ? 3 : displayStyle.valveBorderWidth;

        context.strokeStyle =
          selectedItem === valve
            ? displayStyle.selectedColor
            : displayStyle.valveBorderColor;

        context.stroke();
      }

      function drawPump(pump, value) {
        let color = displayStyle.pumpUnknownColor;

        if (value === true || value === 1) {
          color = displayStyle.pumpOnColor;
        } else if (value === false || value === 0) {
          color = displayStyle.pumpOffColor;
        }

        context.beginPath();
        context.arc(pump.x, pump.y, displayStyle.pumpRadius, 0, Math.PI * 2);

        // context.fillStyle = color;
        // context.fill();

        context.lineWidth =
          selectedItem === pump ? 3 : displayStyle.pumpBorderWidth;

        context.strokeStyle =
          selectedItem === pump ? displayStyle.selectedColor : color;

        context.stroke();
      }

      function drawSensor(sensor, value) {
        let formattedValue = "---";

        const numericValue = Number(value) * (sensor.scale ?? 1);

        if (Number.isFinite(numericValue)) {
          const absValue = Math.abs(numericValue);

          formattedValue =
            absValue !== 0 && (absValue >= 1e4 || absValue < 1e-2)
              ? numericValue.toExponential(sensor.decimals)
              : numericValue.toFixed(sensor.decimals);
        }

        const text =
          (sensor.label ? `${sensor.label}: ` : "") +
          `${formattedValue}` +
          (sensor.unit ? ` ${sensor.unit}` : "");

        drawTextBox(
          text,
          sensor.x,
          sensor.y,
          displayStyle.sensorFont,
          displayStyle.sensorValueColor,
          displayStyle.sensorBackground,
          sensor.align ?? "center",
          selectedItem === sensor
            ? displayStyle.selectedColor
            : displayStyle.sensorBorderColor,
        );
      }

      function drawTextBox(
        text,
        x,
        y,
        font,
        textColor,
        backgroundColor,
        alignment = "center",
        borderColor = "rgba(0, 0, 0, 0.8)",
      ) {
        const paddingX = 4;
        const paddingY = 3;

        context.font = font;
        context.textBaseline = "top";

        const textWidth = context.measureText(text).width;
        const boxWidth = textWidth + 2 * paddingX;
        const boxHeight = 22;

        let boxX = x;

        if (alignment === "center") {
          boxX = x - boxWidth / 2;
        }

        context.fillStyle = backgroundColor;
        context.fillRect(boxX, y, boxWidth, boxHeight);

        context.lineWidth = 1;
        context.strokeStyle = borderColor;
        context.strokeRect(boxX, y, boxWidth, boxHeight);

        context.fillStyle = textColor;
        context.fillText(text, boxX + paddingX, y + paddingY);
      }

      // ============================================================
      // DATA UPDATE
      //
      // Call updateDisplay(newDictionary) whenever Python provides
      // a new JSON dictionary.
      // ============================================================

      function updateDisplay(newData) {
        if (!newData || typeof newData !== "object") {
          console.error("Received invalid data:", newData);
          return;
        }

        liveData = {
          ...liveData,
          ...newData,
        };

        // Pumps don't have a direct on/off flag; infer it from drive current.
        for (const pump of pumpDefinitions) {
          const driveCurrent = Number(liveData[`${pump.id}DrvCrt`]);

          if (Number.isFinite(driveCurrent)) {
            liveData[pump.id] = driveCurrent > 0;
          }
        }

        drawDisplay();

        statusText.textContent =
          "Last update: " + new Date().toLocaleTimeString();
      }

      // ============================================================
      // LOAD LIVE DATA FROM JSON FILES
      // ============================================================

      const UPDATE_INTERVAL_MS = 500;

      let loadingData = false;

      async function loadJsonFiles() {
        // Prevent overlapping requests if one update is slow.
        if (loadingData) {
          return;
        }

        loadingData = true;

        try {
          // Timestamp prevents the browser from returning cached JSON.
          const cacheBuster = Date.now();

          const [pvResponse, sensorResponse, bptpResponse] = await Promise.all([
            fetch(`pv_status.json?t=${cacheBuster}`, {
              cache: "no-store",
            }),
            fetch(`sensor_status.json?t=${cacheBuster}`, {
              cache: "no-store",
            }),
            fetch(`bptp_status.json?t=${cacheBuster}`, {
              cache: "no-store",
            }),
          ]);

          if (!pvResponse.ok) {
            throw new Error(`pv_status.json: HTTP ${pvResponse.status}`);
          }

          if (!sensorResponse.ok) {
            throw new Error(
              `sensor_status.json: HTTP ${sensorResponse.status}`,
            );
          }

          if (!bptpResponse.ok) {
            throw new Error(`bptp_status.json: HTTP ${bptpResponse.status}`);
          }

          const pvData = await pvResponse.json();
          const sensorData = await sensorResponse.json();
          const bptpData = await bptpResponse.json();

          // Combine the three dictionaries.
          updateDisplay({
            ...pvData,
            ...sensorData,
            ...bptpData,
          });

          statusText.textContent =
            "Last update: " + new Date().toLocaleTimeString();
        } catch (error) {
          console.error("Could not load JSON data:", error);

          statusText.textContent = "Data loading error: " + error.message;
        } finally {
          loadingData = false;
        }
      }

      // Load immediately.
      loadJsonFiles();

      // Then reload every 500 ms.
      setInterval(loadJsonFiles, UPDATE_INTERVAL_MS);

      // ============================================================
      // RESPONSIVE SCALING
      // ============================================================

      function fitToScreen() {
        if (!image.naturalWidth || !image.naturalHeight) {
          return;
        }

        const availableWidth = viewport.clientWidth - 20;
        const availableHeight = viewport.clientHeight - 20;

        // Scale up or down so the whole image fills the window.
        const scale = Math.min(
          availableWidth / image.naturalWidth,
          availableHeight / image.naturalHeight,
        );

        autoFit = true;
        container.style.maxWidth = "";
        container.style.width = `${Math.round(image.naturalWidth * scale)}px`;
      }

      function showActualSize() {
        autoFit = false;
        container.style.maxWidth = "none";
        container.style.width = `${image.naturalWidth}px`;
      }

      document
        .getElementById("fitButton")
        .addEventListener("click", fitToScreen);

      document
        .getElementById("actualSizeButton")
        .addEventListener("click", showActualSize);

      window.addEventListener("resize", () => {
        if (autoFit) {
          fitToScreen();
        }
      });

      // ============================================================
      // POSITION EDITOR
      // ============================================================

      document
        .getElementById("editButton")
        .addEventListener("click", (event) => {
          editMode = !editMode;

          event.target.textContent = `Edit positions: ${editMode ? "ON" : "OFF"}`;

          canvas.style.cursor = editMode ? "crosshair" : "default";

          if (!editMode) {
            selectedItem = null;
            draggingItem = null;
            drawDisplay();
          }
        });

      canvas.addEventListener("pointerdown", (event) => {
        if (!editMode) {
          return;
        }

        const point = getCanvasPosition(event);
        const item = findItemAt(point.x, point.y);

        if (!item) {
          selectedItem = null;
          drawDisplay();
          return;
        }

        selectedItem = item;
        draggingItem = item;

        dragOffsetX = point.x - item.x;
        dragOffsetY = point.y - item.y;

        canvas.setPointerCapture(event.pointerId);
        drawDisplay();
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!editMode || !draggingItem) {
          return;
        }

        const point = getCanvasPosition(event);

        draggingItem.x = Math.round(point.x - dragOffsetX);
        draggingItem.y = Math.round(point.y - dragOffsetY);

        statusText.textContent = `${draggingItem.id}: x=${draggingItem.x}, y=${draggingItem.y}`;

        drawDisplay();
      });

      canvas.addEventListener("pointerup", (event) => {
        draggingItem = null;

        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
      });

      function getCanvasPosition(event) {
        const rectangle = canvas.getBoundingClientRect();

        return {
          x:
            (event.clientX - rectangle.left) *
            (referenceSize.width / rectangle.width),

          y:
            (event.clientY - rectangle.top) *
            (referenceSize.height / rectangle.height),
        };
      }

      function findItemAt(x, y) {
        // Search valves first.
        for (let i = valveDefinitions.length - 1; i >= 0; i--) {
          const valve = valveDefinitions[i];

          const distance = Math.hypot(x - valve.x, y - valve.y);

          if (distance <= displayStyle.valveRadius + 8) {
            return valve;
          }
        }

        // Search pumps next.
        for (let i = pumpDefinitions.length - 1; i >= 0; i--) {
          const pump = pumpDefinitions[i];

          const distance = Math.hypot(x - pump.x, y - pump.y);

          if (distance <= displayStyle.pumpRadius + 8) {
            return pump;
          }
        }

        // Approximate sensor selection area.
        for (let i = sensorDefinitions.length - 1; i >= 0; i--) {
          const sensor = sensorDefinitions[i];

          if (Math.abs(x - sensor.x) < 54 && Math.abs(y - sensor.y) < 14) {
            return sensor;
          }
        }

        return null;
      }

      // ============================================================
      // COPY UPDATED COORDINATES
      // ============================================================

      document
        .getElementById("copyButton")
        .addEventListener("click", async () => {
          const output = `const valveDefinitions = ${JSON.stringify(
            valveDefinitions,
            null,
            4,
          )};

const pumpDefinitions = ${JSON.stringify(pumpDefinitions, null, 4)};

const sensorDefinitions = ${JSON.stringify(sensorDefinitions, null, 4)};`;

          try {
            await navigator.clipboard.writeText(output);
            statusText.textContent = "Positions copied to clipboard";
          } catch {
            console.log(output);
            statusText.textContent =
              "Clipboard blocked; positions printed in console";
          }
        });
    </script>
  </body>
</html>
